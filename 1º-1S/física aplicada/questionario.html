    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; max-width: 800px; width: 100%; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .question-section { margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; }
        pre.diagram { background-color: #2d2d2d; color: #00ff00; padding: 15px; border-radius: 5px; font-family: 'Courier New', monospace; font-size: 14px; white-space: pre; overflow-x: auto; border: 1px solid #555; display: none; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn { padding: 15px; border: 2px solid #ddd; background: #fff; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { background-color: #f0f8ff; border-color: #3498db; }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
        .controls { display: flex; justify-content: space-between; margin-top: 20px; align-items: center; }
        button.primary-btn { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button.primary-btn:hover { background-color: #2980b9; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .history-section { margin-top: 40px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .hidden { display: none; }
        .score-display { font-size: 1.5rem; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="container" id="start-screen">
        <h1>Teste de Eletrónica</h1>
        <p style="text-align: center;">Base de dados carregada via Script Local.</p>
        
        <div style="text-align: center; margin-top: 20px;">
            <button id="btn-start" class="primary-btn" onclick="startQuiz()">Iniciar Teste</button>
        </div>
        
        <div class="history-section">
            <h2>Histórico</h2>
            <table id="history-table">
                <thead><tr><th>Data</th><th>Pontuação</th><th>%</th></tr></thead>
                <tbody id="history-body"></tbody>
            </table>
            <div style="text-align: center; margin-top: 10px;">
                <button onclick="clearHistory()" style="color: red; background: none; border: none; cursor: pointer; text-decoration: underline;">Limpar Histórico</button>
            </div>
        </div>
    </div>

    <div class="container hidden" id="quiz-screen">
        <div class="controls">
            <span>Pergunta <span id="current-q-num">1</span> de 20</span>
            <span>Pontuação: <span id="current-score">0</span></span>
        </div>
        <div class="question-section">
            <p class="question-text" id="question-text">...</p>
            <pre id="ascii-diagram" class="diagram"></pre>
        </div>
        <div class="options-grid" id="options-container"></div>
        <div class="controls">
            <button id="next-btn" class="primary-btn" onclick="nextQuestion()" disabled>Próxima</button>
        </div>
    </div>

    <div class="container hidden" id="result-screen">
        <h1>Resultado Final</h1>
        <div class="score-display">
            Acertou <span id="final-score">0</span> de 20<br>
            <span id="final-percent" style="font-weight: bold; color: #2c3e50;">0%</span>
        </div>
        <div style="text-align: center;">
            <button class="primary-btn" onclick="location.reload()">Tentar Novamente</button>
        </div>
    </div>

    <script>
        let allQuestionsDB = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        const totalQuestions = 20;

        window.onload = function() {
            loadHistory();
            processData();
        };

        function processData() {
            // Verifica se a variável do arquivo JS foi carregada
            if (typeof perguntasData !== 'undefined') {
                
                // Lógica para detectar se é lista simples ou capítulos
                if (Array.isArray(perguntasData)) {
                    if (perguntasData.length > 0 && perguntasData[0].questoes) {
                        // Achata os capítulos
                        allQuestionsDB = perguntasData.flatMap(cap => cap.questoes);
                    } else {
                        // Já é uma lista simples
                        allQuestionsDB = perguntasData;
                    }
                }
                console.log(`Carregadas ${allQuestionsDB.length} perguntas com sucesso.`);
            } else {
                alert("Erro: O ficheiro 'perguntas.js' não foi encontrado ou está mal formatado.");
            }
        }

        function startQuiz() {
            if (allQuestionsDB.length === 0) {
                alert("Não há perguntas carregadas. Verifique o ficheiro perguntas.js");
                return;
            }

            currentQuestions = allQuestionsDB
                .sort(() => 0.5 - Math.random())
                .slice(0, totalQuestions);

            currentIndex = 0;
            score = 0;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            
            document.getElementById('current-q-num').textContent = currentIndex + 1;
            document.getElementById('current-score').textContent = score;
            document.getElementById('question-text').textContent = `${q.id}) ${q.pergunta}`;
            
            const diagramPre = document.getElementById('ascii-diagram');
            if (q.diagrama_ascii) {
                diagramPre.textContent = q.diagrama_ascii;
                diagramPre.style.display = 'block';
            } else {
                diagramPre.style.display = 'none';
            }

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const options = Object.entries(q.hipoteses);
            options.forEach(([key, text]) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<strong>${key})</strong> ${text}`;
                btn.onclick = () => checkAnswer(key, q.resposta_correta, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('next-btn').disabled = true;
        }

        function checkAnswer(selectedKey, correctKey, btnElement) {
            const buttons = document.querySelectorAll('.option-btn');
            const cleanCorrectKey = correctKey.trim().charAt(0).toUpperCase(); 
            
            buttons.forEach(btn => btn.disabled = true);

            if (selectedKey === cleanCorrectKey) {
                btnElement.classList.add('correct');
                score++;
                document.getElementById('current-score').textContent = score;
            } else {
                btnElement.classList.add('wrong');
                buttons.forEach(btn => {
                    if (btn.innerText.startsWith(`${cleanCorrectKey})`)) {
                        btn.classList.add('correct');
                    }
                });
            }
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const percent = Math.round((score / currentQuestions.length) * 100);
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-percent').textContent = `${percent}%`;
            saveHistory(score, currentQuestions.length, percent);
        }

        function saveHistory(score, total, percent) {
            const historyItem = {
                date: new Date().toLocaleString('pt-PT'),
                score: `${score}/${total}`,
                percent: `${percent}%`
            };
            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            history.unshift(historyItem);
            if (history.length > 10) history.pop();
            localStorage.setItem('quizHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">Sem histórico disponível.</td></tr>';
                return;
            }
            history.forEach(item => {
                const row = `<tr><td>${item.date}</td><td>${item.score}</td><td>${item.percent}</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        function clearHistory() {
            if(confirm("Tem a certeza que deseja limpar o histórico?")) {
                localStorage.removeItem('quizHistory');
                loadHistory();
            }
        }
    </script>
</body>
</html>
