<title>Quiz de Revisão</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f9;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 600px;
    background: #fff;
    margin: auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 6px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
    color: #007bff;
}

.status {
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
}

.question {
    white-space: pre-wrap;
    margin-bottom: 15px;
}

button.option {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 2px solid #ddd;
    background: #fff;
    cursor: pointer;
    text-align: left;
}

button.option:hover {
    border-color: #007bff;
}

.correct { background: #28a745; color: #fff; }
.wrong   { background: #dc3545; color: #fff; }

.controls {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}

.controls button {
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    background: #007bff;
    color: #fff;
    cursor: pointer;
}

.controls button:disabled {
    background: #aaa;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 0.9em;
}

th, td {
    border-bottom: 1px solid #ddd;
    padding: 6px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Quiz de Revisão</h1>

    <div class="status">

    </div>

    <div id="question" class="question"></div>
    <div id="options"></div>

    <div class="controls">
        <button onclick="prev()" id="prevBtn" disabled>Anterior</button>

    </div>
</div>

/* ================================
   LÓGICA DO QUIZ
================================== */
const TOTAL = 20;
let perguntas = [];
let index = 0;
let score = 0;
let answered = [];

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function initQuiz() {
    const copia = [...perguntasData];
    shuffle(copia);
    perguntas = copia.slice(0, TOTAL);
    answered = Array(TOTAL).fill(null);
    loadQuestion();
    loadHistory();
}

function loadQuestion() {
    const q = perguntas[index];
    document.getElementById("qnum").textContent = index + 1;
    document.getElementById("score").textContent = score;

    document.getElementById("question").textContent = q.pergunta;

    const optDiv = document.getElementById("options");
    optDiv.innerHTML = "";

    q.opcoes.split("\n").forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = opt;
        btn.onclick = () => answer(btn, opt);
        optDiv.appendChild(btn);

        if (answered[index]) {
            if (opt.includes(q.resposta)) btn.classList.add("correct");
            if (opt === answered[index] && !opt.includes(q.resposta))
                btn.classList.add("wrong");
        }
    });

    document.getElementById("prevBtn").disabled = index === 0;
}

function answer(button, text) {
    if (answered[index]) return;

    answered[index] = text;
    const correta = perguntas[index].resposta;

    if (text.includes(correta)) score++;

    loadQuestion();

    if (index === TOTAL - 1) saveHistory();
}

function next() {
    if (index < TOTAL - 1) {
        index++;
        loadQuestion();
    }
}

function prev() {
    if (index > 0) {
        index--;
        loadQuestion();
    }
}

/* ================================
   HISTÓRICO
================================== */
function saveHistory() {
    const hist = JSON.parse(localStorage.getItem("quizHistory") || "[]");
    const perc = Math.round((score / TOTAL) * 100);

    hist.unshift({
        data: new Date().toLocaleString("pt-PT"),
        pontos: score,
        perc
    });

    localStorage.setItem("quizHistory", JSON.stringify(hist));
    loadHistory();
}

function loadHistory() {
    const hist = JSON.parse(localStorage.getItem("quizHistory") || "[]");
    const tbody = document.getElementById("history");
    tbody.innerHTML = "";

    hist.forEach(h => {
        tbody.innerHTML += `
            <tr>
                <td>${h.data}</td>
                <td>${h.pontos}/20</td>
                <td>${h.perc}%</td>
            </tr>
        `;
    });
}

function clearHistory() {
    localStorage.removeItem("quizHistory");
    loadHistory();
}

/* ================================
   START
================================== */
initQuiz();
</script>
