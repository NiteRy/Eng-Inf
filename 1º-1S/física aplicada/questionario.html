<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Quiz de Eletrónica - Boylestad</title>
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px; /* Limita a largura em PC, usa 100% em mobile */
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        /* Estilo para os Circuitos ASCII */
        .question-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-wrap; /* Preserva quebras de linha */
        }

        /* Garante que os desenhos ASCII não partam o layout no telemóvel */
        pre {
            background-color: #eee;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto; /* Permite scroll lateral se o desenho for largo */
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border: 1px solid #ccc;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%; /* Botões largos para toque fácil */
        }

        .option-btn:hover {
            background-color: #f0f8ff;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .option-btn.wrong {
            background-color: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .nav-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .score-board {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Histórico */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        /* Ajustes específicos para ecrãs pequenos */
        @media (max-width: 480px) {
            h1 { font-size: 1.2rem; }
            .container { padding: 15px; }
            .option-btn { padding: 12px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quiz Eletrónica</h1>
        
        <div class="score-board">
            Pergunta: <span id="current-q">1</span> / <span id="total-q">0</span> | 
            Pontuação: <span id="score">0</span>
        </div>

        <div id="quiz-area">
            <div id="question-container" class="question-text"></div>
            
            <div id="options-container" class="options-grid"></div>
        </div>

        <div class="controls">
            <button id="prev-btn" class="nav-btn" onclick="prevQuestion()" disabled>Anterior</button>
            <button id="next-btn" class="nav-btn" onclick="nextQuestion()">Próxima</button>
        </div>
    </div>

            </thead>
            <tbody id="history-body">

        </table>
        <button onclick="clearHistory()" style="margin-top:10px; padding:5px 10px; background:#dc3545; color:white; border:none; border-radius:4px;">Limpar Histórico</button>

        // ==========================================
        // LÓGICA DO JOGO
        // ==========================================
        
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(perguntasData.length).fill(null); // Guarda as respostas do utilizador
        let isFinished = false;

        // Inicialização
        document.getElementById('total-q').innerText = perguntasData.length;
        loadHistory();
        showQuestion(currentQuestionIndex);

        function showQuestion(index) {
            const questionData = perguntasData[index];
            const qContainer = document.getElementById('question-container');
            const optContainer = document.getElementById('options-container');

            // Atualiza contadores
            document.getElementById('current-q').innerText = index + 1;
            
            // Lógica para detetar desenhos ASCII
            // Se a pergunta tiver quebras de linha ou caracteres de desenho, coloca dentro de <pre>
            if (questionData.pergunta.includes('\n') || questionData.pergunta.includes('|') || questionData.pergunta.includes('+--')) {
                // Separa o texto introdutório do desenho se possível, ou formata tudo como código
                qContainer.innerHTML = `<pre>${questionData.pergunta}</pre>`;
            } else {
                qContainer.innerText = questionData.pergunta;
            }

            optContainer.innerHTML = '';

            // Se for Verdadeiro/Falso, normalizamos as opções
            let opcoes = questionData.opcoes;
            if (questionData.tipo === 'verdadeiro_falso') {
                opcoes = ["Verdadeiro", "Falso"];
            }

            opcoes.forEach(op => {
                const btn = document.createElement('button');
                btn.innerText = op;
                btn.classList.add('option-btn');
                
                // Se já respondeu a esta pergunta
                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (op === questionData.resposta) {
                        btn.classList.add('correct');
                    } else if (op === userAnswers[index]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectOption(btn, op, questionData.resposta);
                }
                
                optContainer.appendChild(btn);
            });

            // Atualiza estado dos botões de navegação
            document.getElementById('prev-btn').disabled = index === 0;
            
            const nextBtn = document.getElementById('next-btn');
            if (index === perguntasData.length - 1) {
                nextBtn.innerText = "Finalizar";
            } else {
                nextBtn.innerText = "Próxima";
            }
        }

        function selectOption(btnElement, selectedOption, correctOption) {
            // Guarda a resposta
            userAnswers[currentQuestionIndex] = selectedOption;

            // Verifica se acertou
            const isCorrect = selectedOption === correctOption;
            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                document.getElementById('score').innerText = score;
            } else {
                btnElement.classList.add('wrong');
                // Mostra a correta também
                const buttons = document.getElementById('options-container').children;
                for (let btn of buttons) {
                    if (btn.innerText === correctOption) {
                        btn.classList.add('correct');
                    }
                }
            }

            // Bloqueia todos os botões desta pergunta
            const buttons = document.getElementById('options-container').children;
            for (let btn of buttons) {
                btn.disabled = true;
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < perguntasData.length - 1) {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion(currentQuestionIndex);
            }
        }

        function finishQuiz() {
            if (isFinished) return;
            isFinished = true;
            
            const percent = Math.round((score / perguntasData.length) * 100);
            alert(`Quiz terminado!\nPontuação Final: ${score}/${perguntasData.length} (${percent}%)`);
            
            saveHistory(score, perguntasData.length, percent);
            loadHistory();
            
            // Reiniciar opcional
            if(confirm("Deseja reiniciar o quiz?")) {
                location.reload();
            }
        }

        // ==========================================
        // GESTÃO DO HISTÓRICO
        // ==========================================
        function saveHistory(score, total, percent) {
            const historyItem = {
                date: new Date().toLocaleString('pt-PT'),
                score: `${score}/${total}`,
                percent: `${percent}%`
            };
            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            history.unshift(historyItem);
            if (history.length > 10) history.pop(); // Guarda apenas os últimos 10
            localStorage.setItem('quizHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';
            
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Sem histórico.</td></tr>';
                return;
            }

            history.forEach(item => {
                const row = `<tr><td>${item.date}</td><td>${item.score}</td><td>${item.percent}</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        function clearHistory() {
            if(confirm("Tem a certeza que deseja limpar o histórico?")) {
                localStorage.removeItem('quizHistory');
                loadHistory();
            }
        }
    </script>
