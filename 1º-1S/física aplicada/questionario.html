<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Eletrónica - Boylestad</title>
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --info-bg: #e9ecef; /* Cor para a caixa de motivo */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 10px; /* Reduzi um pouco para dar espaço ao esquema */
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* --- NOVO ESTILO: Caixa do Esquema Elétrico --- */
        .schematic-box {
            background-color: #2e2e2e; /* Fundo escuro para contraste estilo terminal */
            color: #00ff00; /* Texto verde estilo fósforo/terminal */
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace; /* ESSENCIAL para alinhar ASCII */
            white-space: pre; /* Mantém espaços e quebras de linha */
            overflow-x: auto; /* Scroll horizontal se o esquema for largo */
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.2;
            display: none; /* Escondido por defeito */
            box-shadow: inset 0 0 10px #000;
        }

        pre {
            background-color: #eee;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border: 1px solid #ccc;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f0f8ff;
            border-color: var(--primary-color);
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 1;
        }

        .option-btn.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .option-btn.wrong {
            background-color: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        /* --- Estilo para a Caixa de Motivo (Aparece ao errar) --- */
        .explanation-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--info-bg);
            border-left: 5px solid var(--error-color); /* Borda vermelha para indicar correção */
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none; /* Escondido por defeito */
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .nav-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .score-board {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        /* Área de resultados final */
        #result-area {
            display: none;
            text-align: center;
        }

        #quiz-area {
            display: block;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.2rem; }
            .container { padding: 15px; }
            .option-btn { padding: 12px; font-size: 0.95rem; }
            .schematic-box { font-size: 0.75rem; } /* Reduz fonte do esquema em mobile */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quiz Eletrónica</h1>
        
        <div id="quiz-ui">
            <div class="score-board">
                Pergunta: <span id="current-q">1</span> / <span id="total-q">20</span> | 
                Pontuação: <span id="score">0</span>
            </div>

            <div id="quiz-area">
                <div id="question-container" class="question-text"></div>
                
                <div id="schematic-container" class="schematic-box"></div>

                <div id="options-container" class="options-grid"></div>
                <div id="explanation-container" class="explanation-box"></div>
            </div>

            <div class="controls">
                <button id="next-btn" class="nav-btn" onclick="nextQuestion()" style="display:none; margin-left: auto;">Próxima &rarr;</button>
            </div>
        </div>

        <div id="result-area">
            <h2>Teste Concluído!</h2>
            <p style="font-size: 1.2rem;">Pontuação Final: <strong id="final-score">0</strong> / 20</p>
            <p id="final-percent"></p>
            <button class="nav-btn" onclick="startNewQuiz()">Novo Teste</button>
        </div>
    </div>

    <div class="container">
        <h3>Histórico de Tentativas</h3>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Pontos</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
        </table>
        <button onclick="clearHistory()" style="margin-top:10px; padding:5px 10px; background:#dc3545; color:white; border:none; border-radius:4px;">Limpar Histórico</button>
    </div>

        const MAX_QUESTIONS = 20; // Define o tamanho do teste
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // Elementos DOM
        const quizUi = document.getElementById('quiz-ui');
        const resultArea = document.getElementById('result-area');
        const qContainer = document.getElementById('question-container');
        const schemaContainer = document.getElementById('schematic-container'); // NOVO ELEMENTO
        const optContainer = document.getElementById('options-container');
        const expContainer = document.getElementById('explanation-container');
        const nextBtn = document.getElementById('next-btn');
        const scoreSpan = document.getElementById('score');
        const currentQSpan = document.getElementById('current-q');

        // Inicializar
        document.getElementById('total-q').innerText = MAX_QUESTIONS;
        loadHistory();
        startNewQuiz();

        function startNewQuiz() {
            // Resetar variáveis
            score = 0;
            currentQuestionIndex = 0;
            isAnswered = false;
            scoreSpan.innerText = "0";

            // Mostrar Quiz, Esconder Resultado
            quizUi.style.display = 'block';
            resultArea.style.display = 'none';

            // 1. Baralhar todas as perguntas
            // Algoritmo Fisher-Yates para misturar o array
            const shuffled = [...perguntasData];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // 2. Pegar apenas as primeiras 20 (ou menos, se não houver tantas)
            const limit = Math.min(shuffled.length, MAX_QUESTIONS);
            currentQuestions = shuffled.slice(0, limit);

            // 3. Carregar primeira
            showQuestion(0);
        }

        function showQuestion(index) {
            const questionData = currentQuestions[index];
            isAnswered = false;

            // Reset UI da pergunta
            expContainer.style.display = 'none';
            expContainer.innerHTML = '';
            nextBtn.style.display = 'none';
            currentQSpan.innerText = index + 1;

            // Renderizar Pergunta (suporta ASCII/Código na string da pergunta, embora agora tenhamos caixa própria)
            if (questionData.pergunta.includes('\n') || questionData.pergunta.includes('|')) {
                qContainer.innerHTML = `<pre>${questionData.pergunta}</pre>`;
            } else {
                qContainer.innerText = questionData.pergunta;
            }

            // --- LÓGICA DO ESQUEMA ELÉTRICO ---
            // Verifica se o esquema existe e não é nulo/vazio
            if (questionData.esquema && questionData.esquema.trim() !== "") {
                schemaContainer.textContent = questionData.esquema; // textContent é seguro para texto puro
                schemaContainer.style.display = 'block';
            } else {
                schemaContainer.style.display = 'none';
                schemaContainer.textContent = '';
            }
            // ----------------------------------

            // Renderizar Opções
            optContainer.innerHTML = '';
            
            // Lidar com opções em string ou array
            let opcoesArray = [];
            if (typeof questionData.opcoes === 'string') {
                opcoesArray = questionData.opcoes.split('\n').filter(o => o.trim() !== '');
            } else {
                opcoesArray = questionData.opcoes;
            }

            opcoesArray.forEach(op => {
                const btn = document.createElement('button');
                btn.innerText = op;
                btn.classList.add('option-btn');
                btn.onclick = () => checkAnswer(btn, op, questionData.resposta, questionData.motivo);
                optContainer.appendChild(btn);
            });
        }

        function checkAnswer(btnElement, selectedOption, correctOption, motivo) {
            if (isAnswered) return;
            isAnswered = true;

            // Lógica de Comparação Robusta
            // Remove espaços e converte para minúsculas
            const cleanSelected = selectedOption.trim().toLowerCase();
            const cleanCorrect = correctOption.trim().toLowerCase();
            
            let isCorrect = false;

            // 1. Comparação direta (Ex: "Verdadeiro" == "Verdadeiro")
            if (cleanSelected === cleanCorrect) isCorrect = true;
            // 2. Início da string (Ex: "A" bate certo com "A) Opção")
            else if (cleanSelected.startsWith(cleanCorrect + ")") || cleanSelected.startsWith(cleanCorrect + " ")) isCorrect = true;
            // 3. Palavras-chave booleanas
            else if (cleanCorrect === "verdadeiro" && cleanSelected.includes("verdadeiro")) isCorrect = true;
            else if (cleanCorrect === "falso" && cleanSelected.includes("falso")) isCorrect = true;

            if (isCorrect) {
                // Acertou
                btnElement.classList.add('correct');
                score++;
                scoreSpan.innerText = score;
            } else {
                // Errou
                btnElement.classList.add('wrong');
                
                // Iluminar a correta
                const buttons = optContainer.children;
                for (let btn of buttons) {
                    const btnText = btn.innerText.trim().toLowerCase();
                    // Usar a mesma lógica para encontrar o botão certo
                    let btnIsCorrect = false;
                    if (btnText === cleanCorrect) btnIsCorrect = true;
                    else if (btnText.startsWith(cleanCorrect + ")") || btnText.startsWith(cleanCorrect + " ")) btnIsCorrect = true;
                    else if (cleanCorrect === "verdadeiro" && btnText.includes("verdadeiro")) btnIsCorrect = true;
                    else if (cleanCorrect === "falso" && btnText.includes("falso")) btnIsCorrect = true;

                    if (btnIsCorrect) btn.classList.add('correct');
                }

                // === AQUI ESTÁ O PEDIDO: ADICIONA MOTIVO APENAS QUANDO ERRO ===
                if (motivo) {
                    expContainer.innerHTML = `<strong>Explicação:</strong> ${motivo}`;
                    expContainer.style.display = 'block';
                }
            }

            // Mostrar botão próxima (ou ver resultado)
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerText = "Ver Resultados 🏁";
            } else {
                nextBtn.innerText = "Próxima Pergunta";
            }
            nextBtn.style.display = 'block';

            // Bloquear botões
            const buttons = optContainer.children;
            for (let btn of buttons) {
                btn.disabled = true;
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            quizUi.style.display = 'none';
            resultArea.style.display = 'block';
            
            const total = currentQuestions.length;
            const percent = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            
            let msg = "";
            if (percent >= 90) msg = `Excelente! (${percent}%)`;
            else if (percent >= 70) msg = `Bom trabalho! (${percent}%)`;
            else if (percent >= 50) msg = `Passou. (${percent}%)`;
            else msg = `Precisa de estudar mais. (${percent}%)`;
            
            document.getElementById('final-percent').innerText = msg;

            saveHistory(score, total, percent);
            loadHistory();
        }

        // ==========================================
        // GESTÃO DO HISTÓRICO
        // ==========================================
        function saveHistory(score, total, percent) {
            const historyItem = {
                date: new Date().toLocaleString('pt-PT'),
                score: `${score}/${total}`,
                percent: `${percent}%`
            };
            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            history.unshift(historyItem);
            if (history.length > 5) history.pop();
            localStorage.setItem('quizHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';
            
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Sem histórico.</td></tr>';
                return;
            }

            history.forEach(item => {
                const row = `<tr><td>${item.date}</td><td>${item.score}</td><td>${item.percent}</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        function clearHistory() {
            if(confirm("Tem a certeza que deseja limpar o histórico?")) {
                localStorage.removeItem('quizHistory');
                loadHistory();
            }
        }
    </script>
