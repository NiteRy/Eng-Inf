<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Sistemas Digitais</title>
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --info-bg: #e9ecef; /* Cor para a caixa de motivo */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 10px; /* Reduzi um pouco para dar espaço ao esquema */
            line-height: 1.5;
            white-space: pre-wrap;
        }

        pre {
            background-color: #eee;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border: 1px solid #ccc;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f0f8ff;
            border-color: var(--primary-color);
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 1;
        }

        .option-btn.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .option-btn.wrong {
            background-color: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        /* --- Estilo para a Caixa de Motivo (Aparece ao errar) --- */
        .explanation-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--info-bg);
            border-left: 5px solid var(--error-color); /* Borda vermelha para indicar correção */
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none; /* Escondido por defeito */
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .nav-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .score-board {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        /* Área de resultados final */
        #result-area {
            display: none;
            text-align: center;
        }

        #quiz-area {
            display: block;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.2rem; }
            .container { padding: 15px; }
            .option-btn { padding: 12px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quiz Sistemas Digitais</h1>
        
        <div id="quiz-ui">
            <div class="score-board">
                Pergunta: <span id="current-q">1</span> / <span id="total-q">20</span> | 
                Pontuação: <span id="score">0</span>
            </div>

            <div id="quiz-area">
                <div id="question-container" class="question-text"></div>

                <div id="options-container" class="options-grid"></div>
                <div id="explanation-container" class="explanation-box"></div>
            </div>

            <div class="controls">
                <button id="next-btn" class="nav-btn" onclick="nextQuestion()" style="display:none; margin-left: auto;">Próxima &rarr;</button>
            </div>
        </div>

        <div id="result-area">
            <h2>Teste Concluído!</h2>
            <p style="font-size: 1.2rem;">Pontuação Final: <strong id="final-score">0</strong> / 20</p>
            <p id="final-percent"></p>
            <button class="nav-btn" onclick="startNewQuiz()">Novo Teste</button>
        </div>
    </div>

    <div class="container">
        <h3>Histórico de Tentativas</h3>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Pontos</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
        </table>
        <button onclick="clearHistory()" style="margin-top:10px; padding:5px 10px; background:#dc3545; color:white; border:none; border-radius:4px;">Limpar Histórico</button>
    </div>

    <script>

        const perguntasData = [
    {
      "id": "1.1",
      "pergunta": "Em comparação com os sistemas analógicos, os sistemas digitais",
      "opcoes": "A) são menos propensos ao ruído\nB) podem representar um número infinito de valores\nC) conseguem lidar com potências muito mais elevadas\nD) todas as anteriores",
      "resposta": "A) são menos propensos ao ruído",
      "motivo": "Os sistemas digitais utilizam níveis discretos (geralmente dois), o que os torna muito mais tolerantes e menos suscetíveis a pequenas variações de ruído em comparação com os sistemas analógicos contínuos."
    },
    {
      "id": "1.2",
      "pergunta": "O número de valores que podem ser atribuídos a um bit são",
      "opcoes": "A) um\nB) dois\nC) três\nD) dez",
      "resposta": "B) dois",
      "motivo": "Um bit (binary digit) só pode assumir dois valores distintos de lógica: 0 ou 1."
    },
    {
      "id": "1.3",
      "pergunta": "A medição de tempo entre o ponto de 50% na borda de subida (leading edge) de um impulso e o ponto de 50% na borda de descida (trailing edge) do impulso é chamada de",
      "opcoes": "A) rise time\nB) fall time\nC) período\nD) pulse width",
      "resposta": "D) pulse width",
      "motivo": "A largura de impulso (pulse width) é definida formalmente como o intervalo de tempo entre os pontos de 50% dos flancos de subida e descida."
    },
    {
      "id": "1.4",
      "pergunta": "A medição de tempo entre o ponto de 90% na borda de descida (trailing edge) de um impulso e o ponto de 10% na borda de descida do impulso é chamada de",
      "opcoes": "A) rise time\nB) fall time\nC) período\nD) pulse width",
      "resposta": "B) fall time",
      "motivo": "O tempo de descida (fall time) é medido no flanco de descida entre os limites de 90% e 10% da amplitude máxima do impulso."
    },
    {
      "id": "1.5",
      "pergunta": "O recíproco da frequência de um sinal de relógio (clock) é o",
      "opcoes": "A) rise time\nB) fall time\nC) período\nD) pulse width",
      "resposta": "C) período",
      "motivo": "Por definição física e matemática, o período (T) é o inverso da frequência (f), ou seja, T = 1/f."
    },
    {
      "id": "1.6",
      "pergunta": "Se o período de um sinal de clock é 500 ps, a frequência é",
      "opcoes": "A) 2 MHz\nB) 200 MHz\nC) 2 GHz\nD) 20 GHz",
      "resposta": "C) 2 GHz",
      "motivo": "Aplicando f = 1/T, temos f = 1 / (500 * 10^-12 s) = 2 * 10^9 Hz = 2 GHz."
    },
    {
      "id": "1.7",
      "pergunta": "As portas AND, OR e NOT podem ser utilizadas para formar",
      "opcoes": "A) dispositivos de armazenamento\nB) comparadores\nC) seletores de dados\nD) todas as anteriores",
      "resposta": "D) todas as anteriores",
      "motivo": "Estas portas lógicas básicas são os blocos fundamentais de construção para qualquer circuito lógico combinatório ou sequencial, incluindo seletores, comparadores e latches/registos."
    },
    {
      "id": "1.8",
      "pergunta": "Um shift register é um exemplo de um",
      "opcoes": "A) dispositivo de armazenamento\nB) comparador\nC) seletor de dados\nD) counter",
      "resposta": "A) dispositivo de armazenamento",
      "motivo": "Um registo de deslocamento (shift register) é composto por uma cadeia de flip-flops concebidos para armazenar e deslocar dados digitais temporariamente."
    },
    {
      "id": "1.9",
      "pergunta": "Um dispositivo que é utilizado para comutar uma de várias linhas de entrada para uma única linha de saída chama-se",
      "opcoes": "A) comparador\nB) decoder\nC) counter\nD) multiplexer",
      "resposta": "D) multiplexer",
      "motivo": "O multiplexer (MUX) atua como um seletor digital de dados, encaminhando uma das suas várias linhas de entrada para uma saída comum com base nos sinais de seleção."
    },
    {
      "id": "1.10",
      "pergunta": "Para a maioria dos trabalhos digitais, um osciloscópio deve ser acoplado ao sinal usando",
      "opcoes": "A) acoplamento AC\nB) acoplamento DC\nC) acoplamento GND\nD) nenhum dos anteriores",
      "resposta": "B) acoplamento DC",
      "motivo": "O acoplamento DC permite visualizar os níveis absolutos de tensão contínua (como 0 V e 5 V), o que é indispensável para analisar estados digitais estáticos e a forma de onda exata."
    },
    {
"id": "1.11",
"pergunta": "O duty cycle de uma onda quadrada periódica que está em nível HIGH durante 15 ms e em nível LOW durante 45 ms é de",
"opcoes": "A) 15%\nB) 25%\nC) 33%\nD) 75%",
"resposta": "B) 25%",
"motivo": "O período total é T = 15 ms + 45 ms = 60 ms. O duty cycle calcula-se por (thigh / T) * 100%, ou seja, (15 / 60) * 100% = 25%."
},
{
"id": "1.12",
"pergunta": "A principal vantagem da transmissão de dados em formato paralelo face ao formato série é",
"opcoes": "A) menor necessidade de condutores elétricos\nB) maior velocidade de transferência de dados\nC) imunidade absoluta à diafonia (crosstalk)\nD) maior alcance de distância do sinal",
"resposta": "B) maior velocidade de transferência de dados",
"motivo": "A transmissão paralela envia múltiplos bits simultaneamente através de várias linhas físicas, permitindo taxas de transferência superiores a curto alcance."
},
{
"id": "1.13",
"pergunta": "Um sinal digital não periódico caracteriza-se por",
"opcoes": "A) repetir o mesmo padrão em intervalos de tempo idênticos\nB) ter um duty cycle constante de exatamente 50%\nC) possuir transições de nível lógico que ocorrem de forma aleatória ou variável\nD) não poder ser visualizado num osciloscópio digital",
"resposta": "C) possuir transições de nível lógico que ocorrem de forma aleatória ou variável",
"motivo": "Os sinais não periódicos contêm pacotes de dados ou pulsos que variam no tempo dependendo da informação transmitida, sem um ciclo repetitivo constante."
},
{
"id": "1.14",
"pergunta": "O parâmetro de tensão V_IH (Input High Voltage) define a",
"opcoes": "A) tensão máxima gerada na saída de uma porta em nível HIGH\nB) tensão mínima que uma porta reconhece garantidamente como nível lógico HIGH\nC) tensão máxima de ruído tolerada na entrada\nD) tensão de alimentação de pico do circuito integrado",
"resposta": "B) tensão mínima que uma porta reconhece garantidamente como nível lógico HIGH",
"motivo": "V_IH estabelece o limite inferior da gama de tensões de entrada que o circuito eletrónico interpretará de forma estável como nível lógico 1."
},
{
"id": "1.15",
"pergunta": "A principal diferença entre circuitos combinatórios e circuitos sequenciais é que os sequenciais",
"opcoes": "A) não usam portas lógicas na sua implementação\nB) operam apenas com sinais analógicos e filtros de frequência\nC) possuem elementos de memória que fazem a saída depender de estados anteriores\nD) são muito menos propensos a sofrer de ruído elétrico",
"resposta": "C) possuem elementos de memória que fazem a saída depender de estados anteriores",
"motivo": "Os circuitos sequenciais contêm realimentação e armazenamento de estado (como flip-flops), fazendo com que a saída dependa das entradas atuais e do estado interno atual."
},
{
"id": "1.16",
"pergunta": "O fenómeno da diafonia (crosstalk) em barramentos digitais de alta velocidade é causado por",
"opcoes": "A) atenuação resistiva excessiva em cabos curtos\nB) acoplamento capacitivo ou indutivo indesejado entre linhas condutoras adjacentes\nC) incompatibilidade de frequência entre diferentes osciladores de clock\nD) utilização de fontes de alimentação de baixa corrente",
"resposta": "B) acoplamento capacitivo ou indutivo indesejado entre linhas condutoras adjacentes",
"motivo": "A rápida comutação de corrente e tensão numa linha induz ruído eletromagnético nas linhas vizinhas, gerando sinais indesejados (falsos lógicos)."
},
{
"id": "1.17",
"pergunta": "O atraso de propagação (propagation delay) de uma porta lógica representa o tempo que decorre entre",
"opcoes": "A) a ligação da fonte de alimentação e a estabilização das saídas\nB) a transição do sinal de entrada e a correspondente alteração na saída\nC) dois flancos de subida consecutivos do sinal de relógio\nD) a aplicação de um nível HIGH e o aquecimento térmico do componente",
"resposta": "B) a transição do sinal de entrada e a correspondente alteração na saída",
"motivo": "Este atraso reflete o tempo físico necessário para que os transistores internos mudem de estado de condução e propaguem a alteração lógica para o pino de saída."
},
{
"id": "1.18",
"pergunta": "Para analisar simultaneamente dezenas de canais de dados digitais paralelos e verificar o sincronismo de protocolos lógicos, o instrumento mais indicado é",
"opcoes": "A) o multímetro digital em modo autorange\nB) o osciloscópio analógico de fósforo duplo\nC) o analisador de lógica (logic analyzer)\nD) o gerador de funções de varrimento linear",
"resposta": "C) o analisador de lógica (logic analyzer)",
"motivo": "Os analisadores de lógica possuem múltiplos canais de entrada otimizados para descodificar sequências binárias, estados lógicos e barramentos complexos."
},
{
"id": "1.19",
"pergunta": "As interferências eletromagnéticas (EMI) em sistemas digitais rápidos podem ser minimizadas através de",
"opcoes": "A) utilização de linhas de transmissão longas sem qualquer terminação de sinal\nB) planos de terra contínuos e blindagem metálica adequada no circuito impresso\nC) aumento deliberado da impedância interna das linhas de sinal\nD) remoção de todos os condensadores de desacoplamento das fontes de alimentação",
"resposta": "B) planos de terra contínuos e blindagem metálica adequada no circuito impresso",
"motivo": "Blindagens e planos de terra sólidos reduzem o loop de corrente e absorvem radiações espúrias, confinando o campo eletromagnético gerado pelas comutações."
},
{
"id": "1.20",
"pergunta": "Se um trem de impulsos possui uma largura de impulso (pulse width) de 2 microsegundos e um período de 8 microsegundos, a sua frequência de repetição é",
"opcoes": "A) 125 kHz\nB) 250 kHz\nC) 500 kHz\nD) 1 MHz",
"resposta": "A) 125 kHz",
"motivo": "A frequência depende exclusivamente do período (f = 1 / T). Assim, f = 1 / (8 * 10^-6 s) = 125 000 Hz = 125 kHz."
},
    {
      "id": "2.1",
      "pergunta": "Para o número binário 1000, o peso da coluna com o 1 é",
      "opcoes": "A) 4\nB) 6\nC) 8\nD) 10",
      "resposta": "C) 8",
      "motivo": "No sistema posicional binário, os pesos das colunas da direita para a esquerda são 2^0=1, 2^1=2, 2^2=4 e 2^3=8. Para o bit na posição mais significativa de 1000, o peso é 8."
    },
    {
      "id": "2.2",
      "pergunta": "O complemento para 2 (2's complement) de 1000 é",
      "opcoes": "A) 0111\nB) 1000\nC) 1001\nD) 1010",
      "resposta": "B) 1000",
      "motivo": "Para obter o complemento para 2 de 1000: primeiro inverte-se os bits (complemento para 1) obtendo 0111, depois soma-se 1, resultando em 1000."
    },
    {
      "id": "2.3",
      "pergunta": "O número binário fracionário 0.11 tem o valor decimal de",
      "opcoes": "A) 1/4\nB) 1/2\nC) 3/4\nD) nenhum dos anteriores",
      "resposta": "C) 3/4",
      "motivo": "Os pesos após o ponto binário são 2^-1 (0.5) e 2^-2 (0.25). Portanto, 0.11 binário equivale a 0.5 + 0.25 = 0.75, que corresponde a 3/4."
    },
    {
      "id": "2.4",
      "pergunta": "O número hexadecimal 2C tem o valor decimal equivalente de",
      "opcoes": "A) 14\nB) 44\nC) 64\nD) nenhum dos anteriores",
      "resposta": "B) 44",
      "motivo": "A conversão calcula-se por: 2 * 16^1 + C * 16^0. Sendo C = 12 em decimal, temos 32 + 12 = 44."
    },
    {
      "id": "2.5",
      "pergunta": "Assuma que um número em vírgula flutuante (floating point) é representado em binário. Se o bit de sinal for 1, o",
      "opcoes": "A) número é negativo\nB) número é positivo\nC) expoente é negativo\nD) expoente é positivo",
      "resposta": "A) número é negativo",
      "motivo": "Nas normas de representação binária (como a IEEE 754), o bit de sinal de valor 1 indica um número negativo, enquanto o valor 0 indica um número positivo."
    },
    {
      "id": "2.6",
      "pergunta": "Quando dois números com sinal positivos são somados, o resultado pode ser maior do que o tamanho máximo suportado pelos números originais, criando um overflow. Esta condição é indicada por",
      "opcoes": "A) uma alteração no bit de sinal\nB) um carry out da posição do sinal\nC) um resultado igual a zero\nD) fumo",
      "resposta": "A) uma alteração no bit de sinal",
      "motivo": "Ao somar dois valores positivos com sinal, se o resultado exceder o limite positivo máximo, o bit de sinal passará incorretamente a 1 (indicando sinal negativo), o que evidencia a ocorrência de overflow."
    },
    {
      "id": "2.7",
      "pergunta": "O número 1010 em código BCD é",
      "opcoes": "A) igual ao decimal oito\nB) igual ao decimal dez\nC) igual ao decimal doze\nD) inválido",
      "resposta": "D) inválido",
      "motivo": "O código BCD (Binary Coded Decimal) apenas utiliza as combinações binárias de 0000 a 1001 (que representam os dígitos de 0 a 9). Qualquer valor acima de 9 (como 1010, que é 10) é considerado inválido em BCD."
    },
    {
      "id": "2.8",
      "pergunta": "Um exemplo de um código não pesado (unweighted code) é o",
      "opcoes": "A) binário\nB) decimal\nC) BCD\nD) Gray code",
      "resposta": "D) Gray code",
      "motivo": "No Gray code, as posições dos bits não possuem pesos aritméticos associados, ao contrário do binário puro, do decimal e do BCD."
    },
    {
      "id": "2.9",
      "pergunta": "Um exemplo de um código alfanumérico é o",
      "opcoes": "A) hexadecimal\nB) ASCII\nC) BCD\nD) CRC",
      "resposta": "B) ASCII",
      "motivo": "O código ASCII (American Standard Code for Information Interchange) é utilizado para representar caracteres alfanuméricos, símbolos e caracteres de controlo."
    },
    {
      "id": "2.10",
      "pergunta": "Um exemplo de um método de deteção de erros para dados transmitidos é o",
      "opcoes": "A) teste de paridade (parity check)\nB) CRC\nC) ambos os anteriores\nD) nenhum dos anteriores",
      "resposta": "C) ambos os anteriores",
      "motivo": "Tanto o teste de paridade (simples) como o CRC (Cyclic Redundancy Check, mais robusto e baseado em polinómios) são métodos padrão de deteção de erros em comunicações digitais."
    },
    {
"id": "2.11",
"pergunta": "A gama de valores inteiros decimais com sinal que pode ser representada em complemento para 2 usando 8 bits é de",
"opcoes": "A) -127 a +127\nB) -128 a +127\nC) -255 a +255\nD) 0 a 255",
"resposta": "B) -128 a +127",
"motivo": "A fórmula para a gama em complemento para 2 de N bits é de -2^(N-1) a +(2^(N-1) - 1). Para N = 8, temos -128 a +127."
},
{
"id": "2.12",
"pergunta": "No formato IEEE 754 de precisão simples para vírgula flutuante (floating point), o expoente de 8 bits é armazenado usando uma representação polarizada (biased). O valor do bias é de",
"opcoes": "A) 127\nB) 128\nC) 1023\nD) 1024",
"resposta": "A) 127",
"motivo": "O formato de precisão simples adiciona um bias de 127 ao expoente real para garantir que todos os valores de expoente armazenados sejam estritamente positivos."
},
{
"id": "2.13",
"pergunta": "O número hexadecimal fracionário 0.C equivale ao seguinte valor decimal",
"opcoes": "A) 0.12\nB) 0.60\nC) 0.75\nD) 0.82",
"resposta": "C) 0.75",
"motivo": "A posição fracionária hexadecimal possui peso de 16^-1. Sendo C = 12 em decimal, calculamos 12 * (1/16) = 12/16 = 3/4 = 0.75."
},
{
"id": "2.14",
"pergunta": "Para converter o número Gray code 1100 para o sistema binário puro, o valor resultante é",
"opcoes": "A) 1000\nB) 1011\nC) 1111\nD) 1001",

        const MAX_QUESTIONS = 20; // Define o tamanho do teste
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // Elementos DOM
        const quizUi = document.getElementById('quiz-ui');
        const resultArea = document.getElementById('result-area');
        const qContainer = document.getElementById('question-container');
        const optContainer = document.getElementById('options-container');
        const expContainer = document.getElementById('explanation-container');
        const nextBtn = document.getElementById('next-btn');
        const scoreSpan = document.getElementById('score');
        const currentQSpan = document.getElementById('current-q');

        // Inicializar
        document.getElementById('total-q').innerText = MAX_QUESTIONS;
        loadHistory();
        startNewQuiz();

        function startNewQuiz() {
            // Resetar variáveis
            score = 0;
            currentQuestionIndex = 0;
            isAnswered = false;
            scoreSpan.innerText = "0";

            // Mostrar Quiz, Esconder Resultado
            quizUi.style.display = 'block';
            resultArea.style.display = 'none';

            // 1. Baralhar todas as perguntas
            // Algoritmo Fisher-Yates para misturar o array
            const shuffled = [...perguntasData];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // 2. Pegar apenas as primeiras 20 (ou menos, se não houver tantas)
            const limit = Math.min(shuffled.length, MAX_QUESTIONS);
            currentQuestions = shuffled.slice(0, limit);

            // 3. Carregar primeira
            showQuestion(0);
        }

        function showQuestion(index) {
            const questionData = currentQuestions[index];
            isAnswered = false;

            // Reset UI da pergunta
            expContainer.style.display = 'none';
            expContainer.innerHTML = '';
            nextBtn.style.display = 'none';
            currentQSpan.innerText = index + 1;

            // Renderizar Pergunta (suporta ASCII/Código na string da pergunta, embora agora tenhamos caixa própria)
            if (questionData.pergunta.includes('\n') || questionData.pergunta.includes('|')) {
                qContainer.innerHTML = `<pre>${questionData.pergunta}</pre>`;
            } else {
                qContainer.innerText = questionData.pergunta;
            }
            // ----------------------------------

            // Renderizar Opções
            optContainer.innerHTML = '';
            
            // Lidar com opções em string ou array
            let opcoesArray = [];
            if (typeof questionData.opcoes === 'string') {
                opcoesArray = questionData.opcoes.split('\n').filter(o => o.trim() !== '');
            } else {
                opcoesArray = questionData.opcoes;
            }

            opcoesArray.forEach(op => {
                const btn = document.createElement('button');
                btn.innerText = op;
                btn.classList.add('option-btn');
                btn.onclick = () => checkAnswer(btn, op, questionData.resposta, questionData.motivo);
                optContainer.appendChild(btn);
            });
        }

        function checkAnswer(btnElement, selectedOption, correctOption, motivo) {
            if (isAnswered) return;
            isAnswered = true;

            // Lógica de Comparação Robusta
            // Remove espaços e converte para minúsculas
            const cleanSelected = selectedOption.trim().toLowerCase();
            const cleanCorrect = correctOption.trim().toLowerCase();
            
            let isCorrect = false;

            // 1. Comparação direta (Ex: "Verdadeiro" == "Verdadeiro")
            if (cleanSelected === cleanCorrect) isCorrect = true;
            // 2. Início da string (Ex: "A" bate certo com "A) Opção")
            else if (cleanSelected.startsWith(cleanCorrect + ")") || cleanSelected.startsWith(cleanCorrect + " ")) isCorrect = true;
            // 3. Palavras-chave booleanas
            else if (cleanCorrect === "verdadeiro" && cleanSelected.includes("verdadeiro")) isCorrect = true;
            else if (cleanCorrect === "falso" && cleanSelected.includes("falso")) isCorrect = true;

            if (isCorrect) {
                // Acertou
                btnElement.classList.add('correct');
                score++;
                scoreSpan.innerText = score;
            } else {
                // Errou
                btnElement.classList.add('wrong');
                
                // Iluminar a correta
                const buttons = optContainer.children;
                for (let btn of buttons) {
                    const btnText = btn.innerText.trim().toLowerCase();
                    // Usar a mesma lógica para encontrar o botão certo
                    let btnIsCorrect = false;
                    if (btnText === cleanCorrect) btnIsCorrect = true;
                    else if (btnText.startsWith(cleanCorrect + ")") || btnText.startsWith(cleanCorrect + " ")) btnIsCorrect = true;
                    else if (cleanCorrect === "verdadeiro" && btnText.includes("verdadeiro")) btnIsCorrect = true;
                    else if (cleanCorrect === "falso" && btnText.includes("falso")) btnIsCorrect = true;

                    if (btnIsCorrect) btn.classList.add('correct');
                }

                // === AQUI ESTÁ O PEDIDO: ADICIONA MOTIVO APENAS QUANDO ERRO ===
                if (motivo) {
                    expContainer.innerHTML = `<strong>Explicação:</strong> ${motivo}`;
                    expContainer.style.display = 'block';
                }
            }

            // Mostrar botão próxima (ou ver resultado)
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerText = "Ver Resultados 🏁";
            } else {
                nextBtn.innerText = "Próxima Pergunta";
            }
            nextBtn.style.display = 'block';

            // Bloquear botões
            const buttons = optContainer.children;
            for (let btn of buttons) {
                btn.disabled = true;
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            quizUi.style.display = 'none';
            resultArea.style.display = 'block';
            
            const total = currentQuestions.length;
            const percent = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            
            let msg = "";
            if (percent >= 90) msg = `Excelente! (${percent}%)`;
            else if (percent >= 70) msg = `Bom trabalho! (${percent}%)`;
            else if (percent >= 50) msg = `Passou. (${percent}%)`;
            else msg = `Precisa de estudar mais. (${percent}%)`;
            
            document.getElementById('final-percent').innerText = msg;

            saveHistory(score, total, percent);
            loadHistory();
        }

        // ==========================================
        // GESTÃO DO HISTÓRICO
        // ==========================================
        function saveHistory(score, total, percent) {
            const historyItem = {
                date: new Date().toLocaleString('pt-PT'),
                score: `${score}/${total}`,
                percent: `${percent}%`
            };
            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            history.unshift(historyItem);
            if (history.length > 5) history.pop();
            localStorage.setItem('quizHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';
            
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Sem histórico.</td></tr>';
                return;
            }

            history.forEach(item => {
                const row = `<tr><td>${item.date}</td><td>${item.score}</td><td>${item.percent}</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        function clearHistory() {
            if(confirm("Tem a certeza que deseja limpar o histórico?")) {
                localStorage.removeItem('quizHistory');
                loadHistory();
            }
        }
    </script>
